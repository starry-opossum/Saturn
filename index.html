<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>土星星云 - 手势控制粒子系统</title>
    <style>
        body { margin: 0; background: #000; overflow: hidden; font-family: 'Inter', sans-serif; }
        #canvas-container { width: 100vw; height: 100vh; }
        #ui-layer { 
            position: absolute; 
            top: 20px; 
            left: 20px; 
            color: white; 
            pointer-events: none; 
            z-index: 10;
            background: rgba(0,0,0,0.5);
            padding: 15px 25px;
            border-radius: 8px;
            backdrop-filter: blur(5px);
            font-size: 14px;
        }
        .btn { 
            pointer-events: auto; 
            background: rgba(255,255,255,0.2); 
            border: 1px solid rgba(255,255,255,0.3);
            color: white; 
            padding: 8px 16px; 
            cursor: pointer; 
            backdrop-filter: blur(10px); 
            transition: 0.3s;
            border-radius: 4px;
            font-size: 14px;
        }
        .btn:hover { background: rgba(255,255,255,0.4); }
        #camera-status {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: #ffaa00;
            background: rgba(0,0,0,0.6);
            padding: 5px 12px;
            border-radius: 20px;
            font-family: monospace;
            font-size: 12px;
            pointer-events: none;
            z-index: 10;
        }
        #hand-info {
            position: absolute;
            bottom: 20px;
            right: 20px;
            color: white;
            background: rgba(0,0,0,0.6);
            padding: 8px 15px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 12px;
            pointer-events: none;
            z-index: 10;
            text-align: right;
        }
        .debug-panel {
            position: absolute;
            top: 20px;
            right: 20px;
            color: #0f0;
            background: rgba(0,0,0,0.7);
            padding: 8px 12px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 11px;
            pointer-events: none;
            z-index: 10;
            text-align: right;
        }
    </style>
</head>
<body>
    <div id="ui-layer">
        <h1>✨ SATURN NEBULA</h1>
        <p style="font-size: 12px; margin-top: -10px; opacity: 0.7;">手势控制 | 拇指-食指距离 → 粒子缩放</p>
        <button class="btn" onclick="toggleFullScreen()">⛶ FULLSCREEN</button>
    </div>
    <div id="camera-status">
        📷 等待摄像头授权...
    </div>
    <div id="hand-info">
        ✋ 手势缩放: <span id="hand-scale-value">0.00</span><br>
        🤏 距离: <span id="distance-px">0</span> px
    </div>
    <div class="debug-panel" id="debug-panel">
        状态: 初始化中...
    </div>
    <div id="canvas-container"></div>

    <script src="https://unpkg.com/@mediapipe/hands/hands.js"></script>
    <script src="https://unpkg.com/@mediapipe/camera_utils/camera_utils.js"></script>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        
        // 全局变量
        let scene, camera, renderer, particleSystem;
        let handScale = 0.5;
        
        // 暴露调试
        window.debug = {};
        
        // --- 创建土星环粒子系统（简化版，确保能显示）---
        function initScene() {
            // 场景
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x010105);
            
            // 相机
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 10, 45);
            camera.lookAt(0, 0, 0);
            
            // 渲染器
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.getElementById('canvas-container').appendChild(renderer.domElement);
            
            // 创建粒子 - 使用标准 PointsMaterial 先测试显示
            const particleCount = 30000;
            const geometry = new THREE.BufferGeometry();
            
            const positions = new Float32Array(particleCount * 3);
            const colors = new Float32Array(particleCount * 3);
            
            // 生成土星环形状的粒子
            for (let i = 0; i < particleCount; i++) {
                // 半径：内环到外环 8 到 30
                const radius = 8 + Math.random() * 22;
                // 角度
                const angle = Math.random() * Math.PI * 2;
                // 高度：环很薄，但有轻微波动
                const yOffset = (Math.random() - 0.5) * 0.8 * (1 - Math.abs(radius - 19) / 15);
                
                const x = Math.cos(angle) * radius;
                const z = Math.sin(angle) * radius;
                const y = yOffset * 1.5;
                
                positions[i*3] = x;
                positions[i*3+1] = y;
                positions[i*3+2] = z;
                
                // 颜色：内环偏金，外环偏红棕
                const t = (radius - 8) / 22;
                const r = 0.9 - t * 0.3;
                const g = 0.7 - t * 0.2;
                const b = 0.4 - t * 0.2;
                colors[i*3] = r;
                colors[i*3+1] = g;
                colors[i*3+2] = b;
            }
            
            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            
            // 创建粒子材质
            const particleMaterial = new THREE.PointsMaterial({
                size: 0.25,
                vertexColors: true,
                blending: THREE.AdditiveBlending,
                transparent: true,
                opacity: 0.9
            });
            
            particleSystem = new THREE.Points(geometry, particleMaterial);
            scene.add(particleSystem);
            
            // 添加一个中心球体（土星本体）
            const coreGeometry = new THREE.SphereGeometry(3, 32, 32);
            const coreMaterial = new THREE.MeshStandardMaterial({
                color: 0xd4a55a,
                emissive: 0x442200,
                roughness: 0.5,
                metalness: 0.3
            });
            const core = new THREE.Mesh(coreGeometry, coreMaterial);
            scene.add(core);
            
            // 添加内环密集粒子（更亮）
            const innerCount = 15000;
            const innerGeometry = new THREE.BufferGeometry();
            const innerPositions = new Float32Array(innerCount * 3);
            const innerColors = new Float32Array(innerCount * 3);
            
            for (let i = 0; i < innerCount; i++) {
                const radius = 5 + Math.random() * 6;
                const angle = Math.random() * Math.PI * 2;
                const yOffset = (Math.random() - 0.5) * 0.3;
                
                innerPositions[i*3] = Math.cos(angle) * radius;
                innerPositions[i*3+1] = yOffset;
                innerPositions[i*3+2] = Math.sin(angle) * radius;
                
                innerColors[i*3] = 1.0;
                innerColors[i*3+1] = 0.8;
                innerColors[i*3+2] = 0.5;
            }
            innerGeometry.setAttribute('position', new THREE.BufferAttribute(innerPositions, 3));
            innerGeometry.setAttribute('color', new THREE.BufferAttribute(innerColors, 3));
            const innerRing = new THREE.Points(innerGeometry, new THREE.PointsMaterial({ size: 0.15, vertexColors: true, blending: THREE.AdditiveBlending }));
            scene.add(innerRing);
            
            // 星空背景
            const starCount = 1500;
            const starGeometry = new THREE.BufferGeometry();
            const starPositions = new Float32Array(starCount * 3);
            for (let i = 0; i < starCount; i++) {
                starPositions[i*3] = (Math.random() - 0.5) * 200;
                starPositions[i*3+1] = (Math.random() - 0.5) * 120;
                starPositions[i*3+2] = (Math.random() - 0.5) * 100 - 80;
            }
            starGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
            const stars = new THREE.Points(starGeometry, new THREE.PointsMaterial({ color: 0xffffff, size: 0.1, transparent: true, opacity: 0.6 }));
            scene.add(stars);
            
            // 添加光源
            const ambientLight = new THREE.AmbientLight(0x222222);
            scene.add(ambientLight);
            const pointLight = new THREE.PointLight(0xffaa66, 1, 50);
            pointLight.position.set(5, 5, 5);
            scene.add(pointLight);
            
            // 调试信息
            document.getElementById('debug-panel').innerHTML = `✨ 粒子数: ${(particleCount + innerCount).toLocaleString()}<br>📐 状态: 运行中`;
            
            window.debug.scene = scene;
            window.debug.camera = camera;
            window.debug.particleSystem = particleSystem;
            
            console.log('✅ 场景初始化完成，粒子数量:', particleCount + innerCount);
        }
        
        // --- 手势识别 ---
        async function initHandTracking() {
            const statusDiv = document.getElementById('camera-status');
            const handScaleSpan = document.getElementById('hand-scale-value');
            const distanceSpan = document.getElementById('distance-px');
            
            if (typeof window.Hands === 'undefined') {
                statusDiv.innerHTML = '⚠️ 手势识别库加载失败 | 粒子效果正常';
                statusDiv.style.color = '#ff6600';
                return;
            }
            
            const videoElement = document.createElement('video');
            videoElement.style.display = 'none';
            videoElement.setAttribute('playsinline', '');
            document.body.appendChild(videoElement);
            
            const hands = new window.Hands({
                locateFile: (file) => `https://unpkg.com/@mediapipe/hands/${file}`
            });
            
            hands.setOptions({
                maxNumHands: 1,
                modelComplexity: 1,
                minDetectionConfidence: 0.5,
                minTrackingConfidence: 0.5
            });
            
            hands.onResults((results) => {
                if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                    const landmarks = results.multiHandLandmarks[0];
                    const thumbTip = landmarks[4];
                    const indexTip = landmarks[8];
                    
                    const dx = thumbTip.x - indexTip.x;
                    const dy = thumbTip.y - indexTip.y;
                    const dz = thumbTip.z - indexTip.z;
                    const distance = Math.sqrt(dx*dx + dy*dy + dz*dz);
                    
                    let newHandScale = Math.min(1, Math.max(0, distance * 2.2));
                    handScale = handScale * 0.7 + newHandScale * 0.3;
                    
                    handScaleSpan.textContent = handScale.toFixed(3);
                    distanceSpan.textContent = Math.floor(distance * 1000);
                    statusDiv.innerHTML = '📷 手势追踪中 ✓';
                    statusDiv.style.color = '#0f0';
                } else {
                    statusDiv.innerHTML = '📷 未检测到手 | 请将手放在摄像头前';
                    statusDiv.style.color = '#ffaa00';
                    handScale = handScale * 0.95 + 0.35 * 0.05;
                }
            });
            
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                videoElement.srcObject = stream;
                await videoElement.play();
                
                if (typeof window.Camera !== 'undefined') {
                    const cameraObj = new window.Camera(videoElement, {
                        onFrame: async () => {
                            await hands.send({ image: videoElement });
                        },
                        width: 640,
                        height: 480
                    });
                    cameraObj.start();
                    statusDiv.innerHTML = '📷 摄像头已启动 | 拇指+食指捏合控制缩放';
                } else {
                    const processFrame = async () => {
                        if (videoElement.readyState >= 2) {
                            await hands.send({ image: videoElement });
                        }
                        requestAnimationFrame(processFrame);
                    };
                    processFrame();
                    statusDiv.innerHTML = '📷 摄像头已启动 | 手势识别工作中';
                }
            } catch (err) {
                console.error('摄像头错误:', err);
                statusDiv.innerHTML = '❌ 无法访问摄像头 | 请检查权限';
                statusDiv.style.color = '#f00';
            }
        }
        
        // --- 动画循环 ---
        let time = 0;
        
        function animate() {
            requestAnimationFrame(animate);
            time += 0.008;
            
            if (particleSystem) {
                // 手势控制：handScale 0~1 映射到粒子大小 0.15 ~ 0.5
                const targetSize = 0.15 + handScale * 0.4;
                particleSystem.material.size = targetSize;
                
                // 缓慢旋转
                particleSystem.rotation.y = time * 0.3;
                particleSystem.rotation.x = Math.sin(time * 0.2) * 0.1;
            }
            
            // 相机轻微跟随手势
            const targetCamZ = 45 - handScale * 8;
            camera.position.z += (targetCamZ - camera.position.z) * 0.05;
            camera.lookAt(0, 0, 0);
            
            renderer.render(scene, camera);
        }
        
        window.toggleFullScreen = () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
            } else {
                document.exitFullscreen();
            }
        };
        
        window.addEventListener('resize', () => {
            if (camera && renderer) {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            }
        });
        
        // 启动
        function start() {
            initScene();
            animate();
            setTimeout(() => initHandTracking(), 1000);
        }
        
        start();
    </script>
</body>
</html>
